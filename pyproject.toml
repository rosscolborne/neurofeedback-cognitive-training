[project]
name = "neurasticity-brainflow-service"
version = "0.5.0"
description = "Local BrainFlow acquisition and signal-processing service for Neurasticity."
requires-python = ">=3.11"
dependencies = [
  "brainflow>=5.22.0",
  "fastapi>=0.115.0",
  "numpy>=2.0.0",
  "pydantic>=2.8.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
