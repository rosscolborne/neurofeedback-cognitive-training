name: CI

on:
  # Draft PRs report every job as skipped. Marking one ready for review
  # (ready_for_review) runs the suite on its head; later pushes to a ready PR
  # (synchronize) rerun it. converted_to_draft is not a trigger, so pushes
  # after converting back to draft skip again.
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets and no Firebase configuration: unit tests use an inert demo
# project, and every Firebase-backed test runs against local emulators.
# Nothing here deploys: the Cloud Functions codebase (functions/) is only
# type-checked, built and tested on the emulators.
# The embedded brainflow_service/ is owned by the shared brainflow-service
# repository, which runs its pytest suite; it is not tested here.

jobs:
  changes:
    name: Code changes
    # Draft pull requests skip the whole workflow; see the comment under `on:`.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Pull requests that change only documentation or agent instructions
      # skip the emulator job; `web` always runs, since check:isolation scans
      # every tracked file. Any other change, a failed diff and manual runs
      # run it. Keep docs_paths in step with ios.yml.
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout is the PR merged into its base: HEAD^1 is the base.
          if ! git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_paths='^(docs/|\.agents/|\.claude/|[^/]+\.md$)|(^|/)README\.md$'
          if grep -vqE "$docs_paths" "$RUNNER_TEMP/changed.txt"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation or agent instructions only; the emulator job is skipped."
          fi

  web:
    # Draft pull requests skip the whole workflow; see the comment under `on:`.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      # @elata-biosciences/eeg-web-ble@0.12.0 declares a peer on a
      # non-existent @elata-biosciences/eeg-web@^0.2.1.
      - run: npm ci --legacy-peer-deps
      - run: npm ci --prefix functions
      - run: npm run check:isolation
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e:typecheck
      - run: npm run test:rules:typecheck
      - run: npm run test:repositories:typecheck
      - run: npm run functions:typecheck
      - run: npm run functions:build

  emulators:
    runs-on: ubuntu-latest
    needs: [changes, web]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --legacy-peer-deps
      - run: npm ci --prefix functions
      - run: npm run test:rules
      # Consumer repositories against the Auth and Firestore emulators, with firestore.rules loaded.
      - run: npm run test:repositories
      # Builds functions/lib, then runs the processing core on the Firestore
      # emulator and the trigger on the Functions emulator (NFCT-19).
      - run: npm run test:functions
      - run: npx playwright test --project=permission-guard
      # Local-emulator browser suite; Playwright uses /usr/bin/google-chrome.
      - run: npm run test:e2e:protocol
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
