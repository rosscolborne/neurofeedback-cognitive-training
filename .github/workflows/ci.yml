name: Pre-merge validation

# The full remote validation a pull request into development needs before it
# merges. Nothing runs it on a push: run it on the PR's branch once the final
# head has passed the local checks (AGENTS.md "Completion and merge
# readiness"):
#
#   gh workflow run ci.yml --ref <branch>
#
# It calls the Web (web.yml), Backend (backend.yml) and iOS (ios.yml)
# workflows, skipping what the branch's changes relative to development
# cannot affect (scripts/ci/classify-changes.sh), and reports one commit
# status, "Pre-merge validation", on the head it validated. Checks from a
# manual run do not appear on the pull request; that status does, so it is
# what the development ruleset can require.
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run every job, including those the changes relative to development do not need'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A newer run on the same branch supersedes this one.
  group: pre-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes relative to development
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      code: ${{ steps.filter.outputs.code }}
      backend: ${{ steps.filter.outputs.backend }}
      native: ${{ steps.filter.outputs.native }}
      scenarios: ${{ steps.filter.outputs.scenarios }}
      behind: ${{ steps.filter.outputs.behind }}
    steps:
      - name: Report the run as pending on the head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=pending -f context='Pre-merge validation'
          -f description='Running' -f target_url="$TARGET_URL" > /dev/null
      # Every branch's history, without file contents (the diff needs only
      # names).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      # The branch's own changes: from where it left development to its head.
      # Run on development itself the listing is empty, which runs
      # everything, as do a failed diff or classification and `full`.
      - id: filter
        env:
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = true ] ||
            ! base=$(git merge-base origin/development HEAD) ||
            ! git diff --no-renames --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt" ||
            ! bash scripts/ci/classify-changes.sh "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/classes.txt"; then
            printf 'code=true\nbackend=true\nnative=true\nscenarios=\n' > "$RUNNER_TEMP/classes.txt"
          fi
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/classes.txt"
          # The run tests the head alone, not the merge GitHub will make, so
          # the result fails a head that lacks development's latest commit
          # (the jobs still run, for their findings).
          if git merge-base --is-ancestor origin/development HEAD; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
            echo "::error::This head does not contain development's latest commit. Merge development into the branch, push, and run this again."
          fi

  web:
    uses: ./.github/workflows/web.yml

  backend:
    needs: [changes, web]
    # Only after web passes. A failed change detection runs it rather than
    # skipping it (see result).
    if: >-
      !cancelled() && needs.web.result == 'success' &&
      (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    uses: ./.github/workflows/backend.yml
    with:
      emulators: ${{ needs.changes.result != 'success' || needs.changes.outputs.code == 'true' }}
      canary: ${{ needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' }}

  ios:
    needs: changes
    # Beside web, as before. A failed change detection runs everything.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    uses: ./.github/workflows/ios.yml
    with:
      native: ${{ needs.changes.result != 'success' || needs.changes.outputs.native == 'true' }}
      scenarios: ${{ needs.changes.outputs.scenarios }}

  result:
    name: Pre-merge result
    needs: [changes, web, backend, ios]
    # Runs after a failure or cancellation too, so the status never stays
    # pending and a skipped job never passes by accident.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Decide and report the commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          BEHIND: ${{ needs.changes.outputs.behind }}
          WEB: ${{ needs.web.result }}
          BACKEND: ${{ needs.backend.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          failed=
          [ "$WEB" = success ] || failed="$failed web=$WEB"
          # Backend and iOS may skip only because the change detection ran and
          # found documentation alone; any other skip fails.
          for job in "backend=$BACKEND" "ios=$IOS"; do
            result=${job#*=}
            if [ "$result" = success ]; then continue; fi
            if [ "$result" = skipped ] && [ "$CHANGES" = success ] && [ "$CODE" = false ]; then continue; fi
            failed="$failed $job"
          done
          # A head that does not contain development's latest commit was not
          # tested as it would merge. Unknown (failed change detection) counts
          # as behind.
          if [ "$BEHIND" != false ]; then failed="$failed behind-development"; fi
          if [[ " $WEB $BACKEND $IOS " == *" cancelled "* ]]; then
            state=error
            description="Cancelled"
          elif [ -n "$failed" ]; then
            state=failure
            description="Failed:$failed"
          else
            state=success
            description="Passed on ${GITHUB_SHA:0:7}"
          fi
          echo "$state: $description"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='Pre-merge validation' \
            -f description="$description" -f target_url="$TARGET_URL" > /dev/null
          [ "$state" = success ]
