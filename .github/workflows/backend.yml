name: Backend (Firebase)

# The Firebase-backed suites. Manual, or called by Pre-merge validation
# (ci.yml), which skips a job the branch's changes cannot affect
# (scripts/ci/classify-changes.sh); nothing runs it on a push.
# - emulators: rules, repositories, Cloud Functions and the emulator browser
#   suites on local emulators, plus the canary's emulator rehearsal. Run the
#   same suites locally first (AGENTS.md "Checks").
# - canary: one consumer journey against nfct-dev, the real backend
#   TestFlight uses (docs/nfct/nfct-dev-canary.md). Agents do not run it
#   themselves; this job does.
on:
  workflow_dispatch:
    inputs:
      emulators:
        description: 'Emulator suites: rules, repositories, Functions, the browser suite and the canary rehearsal'
        type: boolean
        default: true
      canary:
        description: 'nfct-dev canary: one consumer journey against the real nfct-dev backend'
        type: boolean
        default: true
  workflow_call:
    inputs:
      emulators:
        type: boolean
        default: true
      canary:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so a manual run and a
  # Pre-merge validation run of the same branch do not cancel each other.
  # The canary's cleanup step runs on cancellation too.
  group: ${{ github.workflow }}-backend-${{ github.ref }}
  cancel-in-progress: true

# No secrets. Every Firebase-backed test runs against local emulators, except
# the nfct-dev canary, which signs up and cleans up as an ordinary user with
# nfct-dev's public web config. Nothing here deploys: the Cloud Functions
# codebase (functions/) is only built and tested on the emulators.

jobs:
  emulators:
    runs-on: ubuntu-latest
    if: inputs.emulators
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --legacy-peer-deps
      - run: npm ci --prefix functions
      - run: npm run test:rules
      # Consumer repositories against the Auth and Firestore emulators, with firestore.rules loaded.
      - run: npm run test:repositories
      # Builds functions/lib, then runs the processing core on the Firestore
      # emulator and the trigger on the Functions emulator (NFCT-19).
      - run: npm run test:functions
      - run: npx playwright test --project=permission-guard
      # Local-emulator browser suite; Playwright uses /usr/bin/google-chrome.
      # It runs the Functions emulator too, so saved game sessions get their
      # trusted result and progress (NFCT-22); the script builds functions/lib
      # first, from the functions dependencies installed above.
      - run: npm run test:e2e:protocol
      # The nfct-dev canary's journey and cleanup, rehearsed on the emulators,
      # so a red canary with a green rehearsal points at the backend.
      - name: Rehearse the nfct-dev canary on the emulators
        env:
          NFCT_CANARY_TARGET: emulators
        run: npx firebase emulators:exec --only auth,firestore --project demo-neurasticity-protocol-e2e "node scripts/canary/canary.mjs run"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  canary:
    name: nfct-dev canary
    # It runs beside the emulators job, not after it.
    if: inputs.canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # nfct-dev's web config, the same values as the Xcode Cloud workflow's
    # environment. It is public (it ships in every build), so it lives in
    # repository variables, not secrets. There are no secrets here: the
    # canary signs up and cleans up as an ordinary user.
    env:
      NFCT_CANARY_TARGET: nfct-dev
      VITE_FIREBASE_API_KEY: ${{ vars.NFCT_DEV_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.NFCT_DEV_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.NFCT_DEV_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.NFCT_DEV_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NFCT_DEV_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.NFCT_DEV_FIREBASE_APP_ID }}
    steps:
      # A fork's code would get the shared backend. Only people with write
      # access can start this workflow, so no pull_request event reaches it
      # today; this keeps a fork out if one ever does. Failing, not skipping,
      # keeps a required check from passing.
      - name: Same-repository pull requests only
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::The nfct-dev canary does not run pull requests from forks. Push the branch to this repository and open the pull request from there."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build the production bundle with nfct-dev's web config
        run: node scripts/canary/canary.mjs build
      # Written before the account exists, so cleanup can find a partial run.
      - name: Create the disposable identity
        id: identity
        env:
          NFCT_CANARY_IDENTITY_FILE: ${{ runner.temp }}/nfct-canary/identity.json
        run: node scripts/canary/canary.mjs prepare
      # One fresh account, one iPhone-sized Chromium, no retries.
      - name: Consumer journey against nfct-dev
        env:
          NFCT_CANARY_IDENTITY_FILE: ${{ runner.temp }}/nfct-canary/identity.json
        run: npx playwright test --config playwright.canary.config.ts
      # Runs after a failure or cancellation too. A cleanup problem is
      # reported as a warning without changing the journey's result; the
      # owner-run cleanup removes what is left.
      - name: Clean up the disposable account
        if: always() && steps.identity.outcome != 'skipped'
        continue-on-error: true
        env:
          NFCT_CANARY_IDENTITY_FILE: ${{ runner.temp }}/nfct-canary/identity.json
        run: node scripts/canary/canary.mjs cleanup
      # Screenshots only: Playwright's error context records typed values,
      # including the password, and this repository's artifacts are public.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nfct-dev-canary-screenshots
          path: test-results/canary/**/*.png
          if-no-files-found: ignore
          retention-days: 7
