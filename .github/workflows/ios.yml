name: iOS

on:
  # Draft PRs report every job as skipped. Marking one ready for review
  # (ready_for_review) runs the suite on its head; later pushes to a ready PR
  # (synchronize) rerun it. Converting back to draft (converted_to_draft)
  # starts a skipped run that cancels any in-progress one through the
  # concurrency group; pushes while draft skip again.
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    # Weekly: the native job on the oldest supported iOS runtime (below),
    # against `development` (schedules run from the default branch, `main`,
    # which is the TestFlight release branch and gets no CI of its own).
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Simulator scenarios to run, space-separated (smoke, mental-math, lifecycle); empty runs all'
        required: false
        default: ''
        type: string
      ios_runtimes:
        description: 'Older iOS runtimes to run the scenarios on instead of the newest, oldest first; the first that installs and boots is used (for example 16.4 17.5 18.6)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  # Superseded PR pushes are cancelled. A running manual check is never
  # cancelled, though GitHub still drops a queued one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# iOS build checks (NFCT-31); docs/nfct/ios.md explains each layer.
#
# No secrets, no signing and no Firebase configuration: the app is built
# unsigned for the Simulator, and every Firebase-backed step runs against
# local emulators. Nothing here archives, signs or uploads: TestFlight builds
# come from NFCT's Xcode Cloud workflow, whose post-clone hook the macOS job
# runs, or from the owner-run `npm run ios:archive` (docs/nfct/ios.md#releases).

jobs:
  release-bundle:
    name: Release-bundle safety
    needs: changes
    # A failed change detection runs the job rather than skipping it, since a
    # skipped required check counts as passing. Drafts skip (changes is skipped).
    # The weekly run is the native job only.
    if: >-
      !cancelled() && github.event_name != 'schedule' &&
      (needs.changes.result == 'failure' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      # A production build, synced into the iOS project, then checked.
      - run: npm run sync:ios
      - name: The release check refuses the emulator development bundle
        run: |
          npm run sync:ios:emulators
          if npm run verify:ios-release; then
            echo "::error::verify:ios-release accepted the emulator development bundle"
            exit 1
          fi

  webkit:
    name: WebKit iPhone (Playwright)
    needs: changes
    # A failed change detection runs the job rather than skipping it, since a
    # skipped required check counts as passing. Drafts skip (changes is skipped).
    # The weekly run is the native job only.
    if: >-
      !cancelled() && github.event_name != 'schedule' &&
      (needs.changes.result == 'failure' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --legacy-peer-deps
      # Trusted scoring runs in the Functions emulator, which the Mental Math
      # summary spec needs; test:e2e:webkit builds it.
      - run: npm ci --prefix functions
      # Only WebKit: the other suites use the runner's Google Chrome.
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e:webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webkit-playwright-results
          path: test-results/
          retention-days: 7

  changes:
    name: Native changes
    # Draft pull requests skip the whole workflow; see the comment under `on:`.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      native: ${{ steps.filter.outputs.native }}
      scenarios: ${{ steps.filter.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # macOS minutes are expensive, so pull requests run the native job only
      # when they change something the Xcode build or the Simulator scenarios
      # depend on. Other web-only changes cannot break the native compile and
      # are covered by the jobs above and ci.yml. Manual runs and the weekly
      # run always run it.
      # Pull requests that change only documentation or agent instructions
      # also skip the release-bundle, WebKit and native jobs; any other change
      # or a failed diff runs them. Keep docs_paths in step with ci.yml.
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout is the PR merged into its base: HEAD^1 is the base.
          if ! git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_paths='^(docs/|\.agents/|\.claude/|[^/]+\.md$)|(^|/)README\.md$'
          if grep -vqE "$docs_paths" "$RUNNER_TEMP/changed.txt"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation or agent instructions only; the release-bundle and WebKit jobs are skipped."
          fi
          # Unit tests next to the code cannot change what the Simulator runs.
          grep -v '/__tests__/' "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/native-candidates.txt" || true
          native_paths='^(ios/|ci_scripts/|capacitor\.config\.|package(-lock)?\.json$|\.nvmrc$|vite\.config\.ts$|scripts/ios/|scripts/verify-ios-release\.mjs$|\.github/workflows/ios\.yml$|src/main\.tsx$|src/App\.tsx$|src/contexts/AuthContext\.tsx$|src/services/firebase(Config)?\.ts$|src/pages/onboarding/|src/consumer/games/mentalMath/)'
          if grep -qE "$native_paths" "$RUNNER_TEMP/native-candidates.txt"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            grep -E "$native_paths" "$RUNNER_TEMP/native-candidates.txt"
            # Every scenario when Mental Math or the driver changes; otherwise the smoke scenario
            # (sign-up and relaunch) is enough. Dispatch the others for anything else they drive.
            if grep -qE '^(src/consumer/games/mentalMath/|scripts/ios/|\.github/workflows/ios\.yml$)' "$RUNNER_TEMP/native-candidates.txt"; then
              echo "scenarios=" >> "$GITHUB_OUTPUT"
            else
              echo "scenarios=smoke" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "No native-relevant changes; the macOS job is skipped."
          fi

  native:
    name: Xcode build and Simulator smoke
    needs: changes
    # As above: a failed change detection runs it too.
    if: >-
      !cancelled() &&
      (needs.changes.result == 'failure' ||
      (needs.changes.outputs.code == 'true' && needs.changes.outputs.native == 'true'))
    # Pinned image and Xcode. Capacitor 8.5 needs Xcode 26; 26.5 matches an
    # installed iOS 26.5 Simulator runtime on this image.
    runs-on: macos-26
    timeout-minutes: 50
    env:
      XCODE_APP: /Applications/Xcode_26.5.app
      # The weekly run checks the oldest supported iOS (16.4, ADR-002) with
      # the smoke scenario. Playwright WebKit is always the latest WebKit, so
      # this is the only automated check that the bundle runs on it. The
      # runtime is a multi-gigabyte download: never on pull requests.
      IOS_RUNTIMES: ${{ github.event_name == 'schedule' && '16.4 17.5 18.6' || inputs.ios_runtimes }}
      # A failed change detection leaves scenarios empty, which runs them all.
      REQUESTED_SCENARIOS: ${{ github.event_name == 'schedule' && 'smoke' || github.event_name == 'pull_request' && needs.changes.outputs.scenarios || inputs.scenarios }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The weekly run validates `development`; everything else checks out
          # the triggering ref, as before.
          ref: ${{ github.event_name == 'schedule' && 'development' || '' }}
      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version
          xcrun simctl list runtimes
          {
            echo "IOS_DERIVED_DATA=$RUNNER_TEMP/DerivedData"
            echo "IOS_SOURCE_PACKAGES=$RUNNER_TEMP/SourcePackages"
            echo "SIMULATOR_OUT=$RUNNER_TEMP/ios-simulator-scenarios"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-xcode26.5-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'package-lock.json') }}
          restore-keys: spm-${{ runner.os }}-xcode26.5-

      # 1. What an archive would build: the production bundle in Release.
      # The Xcode Cloud post-clone hook itself installs the locked
      # dependencies, builds and syncs the production bundle, and runs
      # verify:ios-release, so every run here also proves that hook.
      - name: Run the Xcode Cloud post-clone hook
        env:
          CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
        run: ios/App/ci_scripts/ci_post_clone.sh
      - name: Resolve Swift packages
        run: npm run ios:build -- resolve
      - name: Build Release for the Simulator, unsigned
        run: npm run ios:build -- Release
      - name: Check the built Release app
        run: node scripts/ios/check-built-app.mjs "$IOS_DERIVED_DATA/Build/Products/Release-iphonesimulator/App.app" Release

      # 2. Negative test: a Release build refuses the development bundle.
      - name: Release refuses the emulator development bundle
        run: |
          npm run sync:ios:emulators
          if npm run ios:build -- Release > "$RUNNER_TEMP/release-guard.log" 2>&1; then
            echo "::error::A Release build accepted the emulator development bundle"
            exit 1
          fi
          grep -F "error: The web bundle" "$RUNNER_TEMP/release-guard.log"

      # 3. Simulator scenarios: the emulator Debug build on an iPhone
      # Simulator, driven through the real UI (docs/nfct/ios.md).
      - name: Choose the Simulator scenarios
        run: |
          # Names and versions only: both lists are passed to a shell below.
          if [[ ! "$REQUESTED_SCENARIOS" =~ ^[a-z,\ -]*$ ]] || [[ ! "$IOS_RUNTIMES" =~ ^[0-9.\ ]*$ ]]; then
            echo "::error::scenarios may contain only scenario names, and ios_runtimes only versions such as 16.4"
            exit 1
          fi
          echo "SCENARIOS=$REQUESTED_SCENARIOS" >> "$GITHUB_ENV"
          node scripts/ios/simulator-smoke.mjs list $REQUESTED_SCENARIOS
      - name: Pick an iPhone Simulator
        id: simulator
        # Bounds the runtime downloads (15 min each) on the minimum-iOS path.
        timeout-minutes: 35
        run: |
          mkdir -p "$SIMULATOR_OUT"
          if [ -n "$IOS_RUNTIMES" ]; then
            # Installs the first of these runtimes that works and reports which.
            udid=$(node scripts/ios/simulator-runtime.mjs "$SIMULATOR_OUT/runtime.json" $IOS_RUNTIMES)
            echo "destination=generic/platform=iOS Simulator" >> "$GITHUB_OUTPUT"
          else
            udid=$(node scripts/ios/simulator-smoke.mjs pick)
            echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build the emulator Debug app for the Simulator
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          node scripts/ios/simulator-smoke.mjs inject
          npm run ios:build -- Debug "$DESTINATION"
          node scripts/ios/check-built-app.mjs "$IOS_DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app" Debug
      - name: Simulator scenarios against the emulators
        # All three scenarios take about 6 minutes; this also bounds every simctl call.
        timeout-minutes: 20
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: >-
          npx firebase emulators:exec --only auth,firestore --project demo-neurasticity-protocol-e2e
          "node scripts/ios/simulator-smoke.mjs run '$IOS_DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app' '$UDID' '$SIMULATOR_OUT' $SCENARIOS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-scenarios
          path: ${{ runner.temp }}/ios-simulator-scenarios
          if-no-files-found: ignore
          retention-days: 14
